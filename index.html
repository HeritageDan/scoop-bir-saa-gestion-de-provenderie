<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCOOPS BIR SAA</title>
    <meta name="description" content="Solution digitale intégrée SCOOPS BIR SAA : gestion des stocks, caisse POS avec impression tickets thermiques hors-ligne, facturation et reporting financier en FCFA." />
    <meta property="og:title" content="SCOOPS BIR SAA" />
    <meta property="og:description" content="Solution digitale intégrée SCOOPS BIR SAA : gestion des stocks, caisse POS avec impression tickets thermiques hors-ligne, facturation et reporting financier en FCFA." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/assets/icon-192.png" />
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('provenda_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
